<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Addresses , Nivora Eats</title>
  <link rel="stylesheet" href="address.css">
  <link rel="stylesheet" href="app.css">
  <script src="api.js"></script>
  <script src="address.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo"><img src="img_logo.jpeg" alt="Nivora Eats Logo"></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="food-list-page.html">Explore Food</a>
      <a href="address.html" class="active">My Addresses</a>
      <a href="user-profile.html">Profile</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-heading">
      <div>
        <p class="eyebrow">YOUR DELIVERY DETAILS</p>
        <h1>My Addresses</h1>
        <p class="subtitle">Manage your saved addresses for easy delivery.</p>
      </div>
      <a href="#add-address" class="btn btn-primary">+ Add Address</a>
    </section>

    <div id="address-message" role="status" style="margin:0 0 16px;font-weight:600;" hidden></div>

    <section class="address-section">
      <h2>Saved Addresses <span class="count" id="address-count">0</span></h2>
      <div class="address-grid" id="address-grid">
        <p class="subtitle">Loading your addresses...</p>
      </div>
    </section>

    <section class="form-section" id="add-address">
      <h2 id="form-title">Add a New Address</h2>
      <p class="subtitle">Enter your delivery details below.</p>

      <form class="address-form" id="address-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" minlength="4" maxlength="50"
                   placeholder="Name of the person receiving" autocomplete="name" required>
          </div>

          <div class="form-group">
            <label for="phoneNo">Phone Number</label>
            <input id="phoneNo" name="phoneNo" type="tel" inputmode="numeric" maxlength="15"
                   placeholder="10-digit mobile number" autocomplete="tel" required>
          </div>

          <div class="form-group" style="grid-column:1 / -1;">
            <label for="addressLine">House No., Street / Area</label>
            <input id="addressLine" name="addressLine" type="text" minlength="5" maxlength="150"
                   placeholder="e.g. Flat 204, Green Street, Kothrud" autocomplete="street-address" required>
          </div>

          <div class="form-group">
            <label for="landmark">Landmark</label>
            <input id="landmark" name="landmark" type="text" maxlength="100"
                   placeholder="e.g. Near Shivaji Temple" required>
          </div>

          <div class="form-group">
            <label for="city">City</label>
            <input id="city" name="city" type="text" maxlength="50"
                   placeholder="Enter city" autocomplete="address-level2" required>
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <input id="state" name="state" type="text" maxlength="50" value="Maharashtra"
                   placeholder="Enter state" autocomplete="address-level1" required>
          </div>

          <div class="form-group">
            <label for="pincode">Pincode</label>
            <input id="pincode" name="pincode" type="text"
                   inputmode="numeric" pattern="[0-9]{6}"
                   maxlength="6" placeholder="6-digit pincode" autocomplete="postal-code" required>
          </div>

          <div class="form-group">
            <label for="addressType">Address Type</label>
            <select id="addressType" name="addressType"
                    style="width:100%;min-height:46px;padding:11px 13px;background:#FFFEFA;border:1px solid var(--border);border-radius:8px;font:inherit;">
              <option value="home">Home</option>
              <option value="work">Work</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" name="makeDefault" id="makeDefault">
          Make this my default address
        </label>

        <button class="btn btn-primary" type="submit" id="save-address">Save Address</button>
        <button class="btn btn-outline" type="button" id="cancel-edit" hidden>Cancel Edit</button>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Made with care by Nivora Eats ♥️</p>
  </footer>
</body>
</html>
